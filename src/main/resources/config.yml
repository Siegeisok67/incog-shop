economy:
  # VAULT uses Vault, but only the provider named below. This prevents EssentialsX from being selected accidentally.
  mode: VAULT
  starting-balance: 500.0
  currency-symbol: "$"
  pay-minimum: 0.01

market:
  # Global toggle for the entire server market.
  # true  = players can buy regardless of stored stock; purchases do not reduce stock.
  # false = purchases require and consume actual server stock.
  infinite-stock-enabled: false

  # New market materials start with 1,000 stock. On first 1.5.0 startup, existing materials below 1,000 are raised to 1,000 once.
  initial-stock: 1000
  target-stock: 512
  maximum-stock-per-material: 1000000
  # Multiplies every buy AND sell price for every material, on top of everything else below.
  # Raise this to make the whole market more expensive without hand-editing every base price
  # in market.yml (existing saved base-price values are left untouched; this scales the price
  # actually charged/paid at trade time).
  price-scale: 1.5
  # Sell price = buy price * (1 - buy-sell-spread). Raised from 0.22 so selling to the market
  # pays noticeably less relative to what it costs to buy the same item back.
  buy-sell-spread: 0.35
  minimum-price-multiplier: 0.35
  maximum-price-multiplier: 4.0
  demand-impact-per-item: 0.0035
  demand-decay-per-minute: 0.985
  maximum-demand-pressure: 1.25
  reject-custom-items: true
  transaction-fee-percent: 2.0
  auto-restock:
    enabled: true
    interval-hours: 72
    below-stock: 100
    minimum-stock: 500
    maximum-stock: 1000
  # Ancient debris is always excluded. Netherite items are tradable.
  excluded-materials: []

# /sell hand and /sell <item> ask the player if they want to propose a custom price instead of the
# standard dynamic market price. A proposed price is never paid out as-is: it's blended against the
# current market price, recent custom-price proposals for that item, current stock, and how much of
# that item has actually been bought/sold in the trailing window below, to produce a single "balanced"
# price. The transaction always executes at the balanced price - the difference between what the
# player asked for and the balanced price is voided (discarded), it is never paid by/to anyone.
custom-sell:
  enabled: true
  # How far back to look when averaging recent custom-price proposals and buy/sell volume.
  window-hours: 6
  # These three weights should add up to 1.0. They control how much the balanced price leans on:
  # the current dynamic market price, the average of recent custom-price proposals for this item,
  # and the recent net buy/sell volume imbalance for this item, respectively.
  market-weight: 0.55
  custom-weight: 0.30
  volume-weight: 0.15
  # However the weighting comes out, the balanced price is still clamped to this range around the
  # current standard market sell price, so one wild proposal can't swing the real price too far.
  min-deviation-multiplier: 0.4
  max-deviation-multiplier: 2.5

player-shops:
  enabled: true
  creation-fee: 25.0
  sales-tax-percent: 3.0
  max-shops-per-player: 12
  allowed-containers:
    - CHEST
    - TRAPPED_CHEST
    - BARREL

saving:
  autosave-seconds: 60

messages:
  prefix: "&6[Incog-Shop]&r "

auction-house:
  enabled: true
  listing-fee: 25.0
  sales-tax-percent: 3.0
  max-active-listings-per-player: 12
  default-duration-hours: 24
  maximum-duration-hours: 168
  minimum-bid-increment: 1.0
  minimum-bid-increment-percent: 5.0

sell-gui:
  enabled: true

market-orders:
  enabled: true
  max-active-orders-per-player: 20
  maximum-items-per-order: 100000
  # Seller fee taken only when an order actually fills.
  sales-tax-percent: 1.0


discord-price-check:
  # Requires DiscordSRV. Incog-Shop uses DiscordSRV's existing bot connection;
  # no second Discord bot token is required.
  enabled: false
  # Enable Discord Developer Mode, right-click the desired text channel, and Copy ID.
  channel-id: ""
  command-prefix: "!"
  history-resolution-minutes: 5
  history-retention-days: 30
  # Default windows shown by !price <item>.
  default-windows: ["1h", "7h", "24h", "7d"]


stash:
  gameplay-overflow:
    enabled: true
    block-drops: true
    mob-drops: true
    notify: true
