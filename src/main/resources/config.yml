economy:
  # VAULT uses Vault, but only the provider named below. This prevents EssentialsX from being selected accidentally.
  mode: VAULT
  starting-balance: 500.0
  currency-symbol: "$"
  pay-minimum: 0.01

market:
  # Global toggle for the entire server market.
  # true  = players can buy regardless of stored stock; purchases do not reduce stock.
  # false = purchases require and consume actual server stock.
  infinite-stock-enabled: false

  # New market materials start with 750 stock, shared server-wide. Buying an item lowers this
  # stock for everyone; selling raises it back. On first startup, existing materials below this
  # amount are raised to it once.
  initial-stock: 750
  target-stock: 512
  maximum-stock-per-material: 1000000
  buy-sell-spread: 0.22
  minimum-price-multiplier: 0.35
  maximum-price-multiplier: 4.0
  demand-impact-per-item: 0.0035
  demand-decay-per-minute: 0.985
  maximum-demand-pressure: 1.25
  reject-custom-items: true
  transaction-fee-percent: 2.0
  # Ancient Debris is always excluded.
  # Netherite in every form (scrap, ingot, block, tools, and armor) and every shulker box color
  # are hard-restricted to Sell Only: players can sell them to the market, but nothing can ever
  # buy them back from server stock, a Buy Order, a Buy Order fill, or the item-add admin command.
  # This is enforced in code, not just by mode, so it cannot be reverted by editing shop-items.yml.
  excluded-materials: []

player-shops:
  enabled: true
  creation-fee: 25.0
  sales-tax-percent: 3.0
  max-shops-per-player: 12
  allowed-containers:
    - CHEST
    - TRAPPED_CHEST
    - BARREL

saving:
  autosave-seconds: 60

messages:
  prefix: "&6[Incog-Shop]&r "

auction-house:
  enabled: true
  listing-fee: 25.0
  sales-tax-percent: 3.0
  max-active-listings-per-player: 12
  default-duration-hours: 24
  maximum-duration-hours: 168
  minimum-bid-increment: 1.0
  minimum-bid-increment-percent: 5.0

sell-gui:
  enabled: true

market-orders:
  enabled: true
  max-active-orders-per-player: 20
  maximum-items-per-order: 100000
  # Seller fee taken only when an order actually fills.
  sales-tax-percent: 1.0
  # Players choose their own Sell Order price, but it must stay within this range around the
  # item's current base price (see shop-items.yml). Example: 0.5 and 2.0 let a sell order be
  # priced anywhere from half to double the base price.
  sell-price-min-multiplier: 0.5
  sell-price-max-multiplier: 2.0

sell-wand:
  # /sellwand gives a wand item. Right-clicking a chest, trapped chest, barrel, or any shulker
  # box (shulker boxes are always allowed regardless of the list below) instantly sells every
  # eligible plain item inside to the server market, the same as the /sell GUI would.
  enabled: true
  containers:
    - CHEST
    - TRAPPED_CHEST
    - BARREL

discord-price-check:
  # Requires DiscordSRV. Incog-Shop uses DiscordSRV's existing bot connection;
  # no second Discord bot token is required.
  enabled: false
  # Enable Discord Developer Mode, right-click the desired text channel, and Copy ID.
  channel-id: ""
  command-prefix: "!"
  history-resolution-minutes: 5
  history-retention-days: 30
  # Default windows shown by !price <item>.
  default-windows: ["1h", "7h", "24h", "7d"]

